spring.application.name=edunexus-backend
server.port=8080

# Load local secrets from backend/.env if it exists (this file is NOT committed to Git)
spring.config.import=optional:file:.env[.properties]

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/edunexus}
spring.datasource.username=${DB_USERNAME:edunexus_app}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# "update" creates/updates tables from entities (development only; see Phase 24 for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Actuator: expose only health and info ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# ---- Never leak stack traces or internal messages in error responses ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never